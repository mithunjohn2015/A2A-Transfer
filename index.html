<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocalDrop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1a1f6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg1:#3b2bd6;--bg2:#1a1f6e;--bg3:#080c2b;
  --fg:#fff;--mut:rgba(255,255,255,.62);--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.14);
  --send:linear-gradient(135deg,#ffb23c,#ff4f81);--recv:linear-gradient(135deg,#27e0a3,#1a9bff);
  --ok:#3df0b0;--bad:#ff6b81;--acc:#6ea8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg3)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 70% at 50% -10%,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;
  padding:max(14px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow-x:hidden}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100dvh - 36px)}
section[hidden]{display:none}
section{flex:1;display:flex;flex-direction:column;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:.2px}
.brand img{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 14px #0006}
.pill{display:flex;align-items:center;gap:8px;max-width:58%;padding:7px 12px;border-radius:99px;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:.78rem;color:var(--mut)}
.pill #status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.ok .dot{background:var(--ok);animation:blink 1.6s infinite}
.pill.bad .dot{background:var(--bad)}
.pill.busy .dot{background:var(--acc);animation:blink .8s infinite}
.pill.ok{color:#fff}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}

/* radar home */
.hero{flex:1;display:flex;align-items:center;justify-content:center;min-height:300px}
.radar{position:relative;width:min(78vw,320px);aspect-ratio:1}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);animation:ping 3.6s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
.ring:nth-child(2){animation-delay:1.2s}.ring:nth-child(3){animation-delay:2.4s}
@keyframes ping{0%{transform:scale(.3);opacity:.7}100%{transform:scale(1.05);opacity:0}}
.sweep{position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 0deg,rgba(110,168,255,0) 0 70%,rgba(110,168,255,.45) 100%);
  animation:spin 3.2s linear infinite;-webkit-mask:radial-gradient(circle,#0000 22%,#000 23%);mask:radial-gradient(circle,#0000 22%,#000 23%)}
@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;inset:34%;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#7a6bff,#2f7bff);box-shadow:0 0 0 8px rgba(255,255,255,.08),0 12px 40px #2f7bff88;animation:float 4s ease-in-out infinite}
.core svg{width:52%;height:52%}
@keyframes float{50%{transform:translateY(-6px)}}
.orbit{position:absolute;inset:0;animation:spin 14s linear infinite}
.orbit i{position:absolute;top:6%;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#ffb23c;box-shadow:0 0 14px #ffb23c}
.orbit.b{animation-duration:20s;animation-direction:reverse}.orbit.b i{top:auto;bottom:10%;background:#27e0a3;box-shadow:0 0 14px #27e0a3;width:10px;height:10px}

/* buttons */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 10px}
.big{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 8px;border:0;border-radius:26px;color:#fff;font:inherit;font-weight:800;
  font-size:1.1rem;box-shadow:0 14px 30px #0005,inset 0 1px 0 #fff5;transition:transform .15s,filter .2s;position:relative;overflow:hidden}
.big svg{width:30px;height:30px}
.big small{font-weight:500;opacity:.85;font-size:.72rem}
.big:active{transform:scale(.95)}
.big.send{background:var(--send)}.big.recv{background:var(--recv)}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fff4 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s infinite}
.big.recv::after{animation-delay:1.2s}
@keyframes shine{40%,100%{transform:translateX(120%)}}
.hint{text-align:center;color:var(--mut);font-size:.8rem;margin:4px 0 8px}
.btn{display:block;width:100%;padding:15px;margin:10px 0 0;border:0;border-radius:18px;font:inherit;font-weight:700;color:#fff;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--send);border:0;box-shadow:0 12px 28px #ff4f8155}
.btn[hidden]{display:none}

/* QR + scanner */
.step{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}
.step i{width:26px;height:4px;border-radius:2px;background:var(--line)}.step i.on{background:var(--acc)}
#showHelp,#scanHelp{text-align:center;color:var(--mut);margin:0 6px 12px}
.qrcard{position:relative;background:#fff;border-radius:28px;padding:16px;margin:0 auto;width:min(100%,340px);box-shadow:0 20px 50px #0007}
.qrcard::before{content:"";position:absolute;inset:-6px;border-radius:34px;border:2px solid rgba(110,168,255,.7);animation:halo 2.2s ease-out infinite}
@keyframes halo{from{transform:scale(.97);opacity:1}to{transform:scale(1.08);opacity:0}}
canvas#qr{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:8px}
.view{position:relative;border-radius:28px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:56vh;margin:0 auto;width:100%;box-shadow:0 20px 50px #0007}
video{width:100%;height:100%;object-fit:cover;display:block}
.corners{position:absolute;inset:14%;pointer-events:none}
.corners i{position:absolute;width:34px;height:34px;border:4px solid #fff;filter:drop-shadow(0 0 6px #6ea8ff)}
.corners i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.corners i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.corners i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.corners i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.corners b{position:absolute;left:4%;right:4%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#6ea8ff,transparent);
  box-shadow:0 0 16px #6ea8ff;animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{from{top:2%}to{top:98%}}

/* connected */
.peers{display:flex;align-items:center;justify-content:center;gap:0;margin:8px 0 18px}
.peer{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.8rem;font-weight:600;width:96px;text-align:center}
.av{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 26px #0006,0 0 0 5px rgba(255,255,255,.08)}
.av svg{width:34px;height:34px}
.av.me{background:var(--send)}.av.you{background:var(--recv);animation:pop .6s .15s both cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.link{flex:1;height:4px;position:relative;margin:0 -6px 22px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 16px);border-radius:2px;overflow:hidden}
.link::after{content:"";position:absolute;top:0;bottom:0;width:36%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:flow 1.6s linear infinite}
@keyframes flow{from{left:-40%}to{left:105%}}

.list{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:6px 14px;margin:6px 0 90px;flex:1;min-height:150px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:150px;color:var(--mut);font-size:.85rem;text-align:center}
.empty svg{width:42px;height:42px;opacity:.55;animation:float 3.5s ease-in-out infinite}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);animation:slide .4s cubic-bezier(.2,.9,.3,1)}
.item:first-child{border-top:0}
@keyframes slide{from{opacity:0;transform:translateX(-22px)}}
.ic{position:relative;flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--glass)}
.ic em{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:800;color:#fff;border:2px solid var(--bg2)}
.item.up .ic em{background:#ff6a5c}.item.down .ic em{background:#1fbf8f}
.t-img{background:linear-gradient(135deg,#ff9a8b55,#ff6a8855)}.t-vid{background:linear-gradient(135deg,#a18cd155,#fbc2eb55)}
.t-aud{background:linear-gradient(135deg,#84fab055,#8fd3f455)}.t-doc{background:linear-gradient(135deg,#6ea8ff55,#4f6dff55)}
.t-zip{background:linear-gradient(135deg,#ffd86f55,#fc626255)}.t-sys{background:linear-gradient(135deg,#ffffff22,#ffffff11)}
.n{flex:1;min-width:0}
.n span{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n small{display:block;color:var(--mut);font-size:.76rem;margin-top:1px}
.item.bad small{color:var(--bad)}.item.done small{color:var(--ok)}
.bar{height:6px;background:rgba(255,255,255,.14);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#6ea8ff,#27e0a3,#6ea8ff);background-size:200% 100%;
  transition:width .25s;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.item button{flex:none;width:auto;margin:0;padding:8px 14px;border:0;border-radius:99px;color:#fff;font:inherit;font-weight:700;font-size:.8rem;background:var(--recv);box-shadow:0 6px 16px #1a9bff44}
.item button + button{background:var(--glass);box-shadow:none;border:1px solid var(--line)}

.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 18px max(16px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg3) 55%,transparent);z-index:5}
.dock .row{max-width:460px;margin:0 auto;display:flex;gap:10px}
.dock .btn{margin:0}.dock .btn.main{flex:1}.dock .btn.off{width:auto;padding:15px 20px}
.fab{display:flex;align-items:center;justify-content:center;gap:10px}
.fab svg{width:22px;height:22px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><img src="icon-192.png" alt="">LocalDrop</div>
  <div class="pill" id="pill"><i class="dot"></i><span id="status">Offline transfer</span></div>
</header>

<section id="home">
  <div class="hero">
    <div class="radar">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="sweep"></div>
      <div class="orbit"><i></i></div><div class="orbit b"><i></i></div>
      <div class="core"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17V5m0 0L3 9m4-4l4 4M17 7v12m0 0l4-4m-4 4l-4-4"/></svg></div>
    </div>
  </div>
  <div class="actions">
    <button id="btnHost" class="big send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>Send<small>show my code</small></button>
    <button id="btnJoin" class="big recv"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>Receive<small>scan a code</small></button>
  </div>
  <p class="hint">Put both phones on the same Wi-Fi or hotspot. No internet needed.</p>
</section>

<section id="show" hidden>
  <div class="step"><i class="on"></i><i></i><i></i></div>
  <p id="showHelp"></p>
  <div class="qrcard"><canvas id="qr"></canvas></div>
  <div style="flex:1"></div>
  <button id="btnScanReply" class="btn main">Next: scan their reply</button>
  <button id="btnCancel1" class="btn">Cancel</button>
</section>

<section id="scan" hidden>
  <div class="step"><i class="on"></i><i class="on"></i><i></i></div>
  <p id="scanHelp"></p>
  <div class="view"><video id="vid" playsinline muted></video><div class="corners"><i></i><i></i><i></i><i></i><b></b></div></div>
  <div style="flex:1"></div>
  <button id="btnCancel2" class="btn">Cancel</button>
</section>

<section id="xfer" hidden>
  <div class="peers">
    <div class="peer"><div class="av me"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg></div><span id="meName">This phone</span></div>
    <div class="link"></div>
    <div class="peer"><div class="av you"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg></div><span id="youName">Other phone</span></div>
  </div>
  <div class="list" id="list">
    <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>Connected. Pick files to send<br>or wait for the other phone.</div>
  </div>
  <div class="dock"><div class="row">
    <button id="btnPick" class="btn main fab"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Send files</button>
    <button id="btnDisc" class="btn off">End</button>
  </div></div>
  <input id="file" type="file" multiple hidden>
</section>
</main>
<script src="qrcode.js"></script>
<script src="jsQR.js"></script>
<script src="signal.js"></script>
<script src="app.js"></script>
</body>
</html>
